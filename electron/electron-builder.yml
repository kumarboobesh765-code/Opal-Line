appId: com.opalline.billing
productName: Opal Line Billing
copyright: Copyright © 2026 Opal Line Jewels LLP

directories:
  output: dist-electron
  # Custom app/installer icon (build/icon.ico — regenerate with
  # `node scripts/build-icon.mjs`)
  buildResources: build

# Never let electron-builder publish on its own — it otherwise infers a GitHub
# release publish (needs a PAT) and fails the build. The release workflow
# attaches the installer to the GitHub Release itself.
publish: null

files:
  - electron/dist/**/*
  - "!**/node_modules/**"
  - "!backend/**"
  - "!frontend/src/**"
  - "!**/*.ts"
  - "!**/tsconfig.json"

# The Electron main/preload bundle goes into app.asar. The backend and the
# frontend dist must NOT: the backend runs as a plain Node child process
# (ELECTRON_RUN_AS_NODE) with no asar filesystem patching, and it serves the
# frontend from resources/frontend/dist.
asar: true

extraResources:
  # Served by the backend at runtime (see frontendDist candidates in
  # backend/src/index.ts) — must live outside app.asar.
  - from: frontend/dist
    to: frontend/dist
    filter:
      - "**/*"
  - from: backend/dist
    to: backend/dist
    filter:
      - "**/*"
      - "!**/.env"
      - "!**/.env.*"
  - from: backend/dist/node_modules
    to: backend/dist/node_modules
  - from: backend/package.json
    to: backend/package.json
  - from: backend/drizzle
    to: backend/drizzle
  # Portable PostgreSQL — optional; present only when scripts/build-desktop.js
  # downloaded it. electron-builder errors on missing sources without
  # filter support, so the build script writes this marker file.
  - from: backend/pgsql-present.flag
    to: pgsql-present.flag
  - from: backend/pgsql
    to: pgsql

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Request no admin privileges — prevents UAC prompt on launch
  requestedExecutionLevel: asInvoker
  # Code-sign the app exe and the NSIS installer with the code-signing
  # certificate in Cert:\CurrentUser\My whose subject contains this name.
  # Defaults to an RFC 3161 timestamp at http://timestamp.digicert.com.
  # A missing/mismatched cert now fails the build instead of silently
  # shipping an unsigned exe.
  signtoolOptions:
    certificateSubjectName: Opal Line Billing

nsis:
  # Trust our code-signing cert for the installing user (no admin needed) so
  # the installed app shows a Valid signature on fresh machines.
  include: build/installer-cert.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Opal Line Billing
  deleteAppDataOnUninstall: false
  runAfterFinish: true
