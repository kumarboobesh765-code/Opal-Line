name: CI

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # CI never builds the desktop app here; skip the ~100 MB Electron download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint (frontend, oxlint)
        run: npm run lint

      - name: Typecheck (backend, tsc)
        run: npm run typecheck

      - name: Unit tests (backend, node --test)
        run: npm test

      - name: Build frontend (tsc -b && vite build)
        run: npm run build

  desktop-e2e:
    name: Desktop installer e2e (Windows)
    # Builds the signed installer exactly like release.yml does, silent-installs
    # it, boots the app and runs the full Playwright suite against the INSTALLED
    # app — the only environment where the bundled-PostgreSQL bootstrap and the
    # packaged backend actually execute.
    runs-on: windows-latest
    needs: checks
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # No ELECTRON_SKIP_BINARY_DOWNLOAD here — electron-builder packages the
      # Electron runtime into the installer.
      - name: Install dependencies
        run: npm ci

      # Same certificate dance as release.yml: the build hard-fails without a
      # cert whose subject contains "Opal Line Billing". Never import into
      # CurrentUser\Root on a headless runner — the confirmation dialog hangs
      # the job; the machine stores never prompt (runners are elevated).
      - name: Import code-signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WIN_SIGNING_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.WIN_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Error 'Missing repository secret WIN_SIGNING_PFX_B64 (base64 PFX of the "Opal Line Billing" code-signing cert). See .github/workflows/release.yml for how to create it.'
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $sec = if ($env:PFX_PASSWORD) { ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force } else { New-Object System.Security.SecureString }
          $cert = Import-PfxCertificate -FilePath $pfx -Password $sec -CertStoreLocation 'Cert:\CurrentUser\My'
          Remove-Item $pfx -Force
          if ($cert.Subject -notlike '*Opal Line Billing*') {
            Write-Error "Unexpected certificate subject: $($cert.Subject) (expected CN=Opal Line Billing)"
            exit 1
          }
          $cer = Join-Path $env:RUNNER_TEMP 'signing-cert.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          certutil -f -addstore Root $cer
          certutil -f -addstore TrustedPublisher $cer
          Remove-Item $cer -Force
          Write-Host "Imported $($cert.Subject) thumbprint=$($cert.Thumbprint)"

      - name: Build signed Windows installer
        run: npm run electron:build

      # Installs silently, verifies the extracted tree + signature + uninstall
      # entry, boots the app and probes PG 47193 / API 47192. Deliberately run
      # WITHOUT -StopAtEnd so the app keeps serving the Playwright suite below.
      - name: Installer smoke test (install + boot the app)
        shell: pwsh
        # Runners can be slow on the first Defender scan of the 145 MB
        # installer; allow 15 minutes before treating the install as stuck.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-test-install.ps1 -InstallTimeoutSec 900

      # The generated first-run credential is surfaced through a desktop
      # dialog, which headless sessions may never show (the app then deletes
      # the credentials JSON in its finally block). The smoke test leaves the
      # app + bundled PostgreSQL running, and the backend verifies the hash
      # against the database on every login - so simply set a known password
      # (the repo's e2e default) in the live database and log in with it.
      - name: Reset admin password for the e2e suite
        shell: pwsh
        run: |
          $hash = node -e "require('argon2').hash('Opal@2026').then(h => console.log(h))"
          if (-not $hash) { Write-Error 'argon2 hash generation failed.'; exit 1 }
          $pgDir = Join-Path $env:LOCALAPPDATA 'Programs\Opal Line Billing\resources\pgsql\bin'
          $pgdata = Join-Path $env:APPDATA 'Opal Line Billing\pgdata'
          $env:PGPASSWORD = (Get-Content (Join-Path $env:APPDATA 'Opal Line Billing\.pg-password') -Raw).TrimEnd()
          $psql = Join-Path $pgDir 'psql.exe'
          $qArgs = @('-h', '127.0.0.1', '-p', '47193', '-U', 'postgres', '-d', 'opal_line', '-v', 'ON_ERROR_STOP=1', '-Atc')
          # Single-quote the SQL so PowerShell does not expand the argon2
          # hash's $-segments as variables; double any SQL single quotes.
          $sql = 'UPDATE users SET password_hash = ''' + $hash.Replace("'", "''") + ''', require_password_change = false WHERE username = ''admin'';'
          $updated = $false
          foreach ($attempt in 1..5) {
            $out = & $psql @qArgs $sql 2>&1
            if ($LASTEXITCODE -eq 0) { $updated = $true; Write-Host "psql: $out"; break }
            Write-Warning "attempt ${attempt}: $out"
            if ("$out" -match 'does not exist') {
              # The startup bootstrap has not completed on this (slow, headless)
              # runner. Show what the backend logged, restart the stack cleanly
              # (never SIGKILL PostgreSQL - stale postmaster.pid) and retry.
              Get-Content (Join-Path $env:APPDATA 'Opal Line Billing\logs\app.log') -Tail 60 -ErrorAction SilentlyContinue | Select-String -Pattern 'Bootstrap|bootstrap|error|ERROR' | ForEach-Object { Write-Host "app.log: $_" }
              Get-Process -Name 'Opal Line Billing' -ErrorAction SilentlyContinue | ForEach-Object { try { $_.Kill(); $_.WaitForExit(5000) | Out-Null } catch {} }
              # Invoke pg_ctl via Start-Process: a plain pipeline stays open
              # forever after a SUCCESSFUL start because postgres.exe inherits
              # pg_ctl's stdout handle and PowerShell waits for EOF.
              $pgctlLog = Join-Path $env:RUNNER_TEMP 'pgctl.log'
              foreach ($mode in @(@('stop', '-m', 'fast'), @('start'))) {
                $args = @($mode[0]) + ($mode | Select-Object -Skip 1) + @('-D', "\"$pgdata\"", '-w', '-t', '120')
                Start-Process -FilePath (Join-Path $pgDir 'pg_ctl.exe') -ArgumentList $args -Wait -NoNewWindow -RedirectStandardOutput $pgctlLog -RedirectStandardError "$pgctlLog.err"
                Get-Content $pgctlLog, "$pgctlLog.err" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "pg_ctl $($mode[0]): $_" }
              }
              Start-Process -FilePath (Join-Path $env:LOCALAPPDATA 'Programs\Opal Line Billing\Opal Line Billing.exe')
              $deadline = (Get-Date).AddSeconds(240)
              while ((Get-Date) -lt $deadline) {
                try { if ((Invoke-WebRequest -Uri 'http://127.0.0.1:47192/api/v1/health' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { break } } catch { Start-Sleep -Seconds 3 }
              }
            } else {
              break
            }
          }
          if (-not $updated) { Write-Error 'psql password reset never succeeded.'; exit 1 }
          Remove-Item Env:PGPASSWORD
          try {
            $health = Invoke-WebRequest -Uri 'http://127.0.0.1:47192/api/v1/health' -UseBasicParsing -TimeoutSec 10
            if ($health.StatusCode -ne 200) { throw "health returned $($health.StatusCode)" }
          } catch {
            Write-Error "Backend not healthy after password reset: $_"
            exit 1
          }

      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Playwright suite against the installed app
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:47192
          E2E_USER: admin
          E2E_PASSWORD: Opal@2026
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-desktop-e2e
          path: |
            test-results/
            e2e/.auth/
          retention-days: 7
          if-no-files-found: ignore
