name: CI

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # CI never builds the desktop app; skip the ~100 MB Electron download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint (frontend, oxlint)
        run: npm run lint

      - name: Typecheck (backend, tsc)
        run: npm run typecheck

      - name: Unit tests (backend, node --test)
        run: npm test

      - name: Build frontend (tsc -b && vite build)
        run: npm run build
